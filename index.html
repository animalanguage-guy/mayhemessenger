<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MayheMessenger</title>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #00ff00; padding: 20px; }
        #chat { height: 400px; border: 2px solid #00ff00; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #000; }
        .msg { margin-bottom: 8px; padding: 5px; border-radius: 4px; }
        input, button, select { background: #222; color: #00ff00; border: 1px solid #00ff00; padding: 10px; font-family: monospace; }
        button { cursor: pointer; }
        button:hover { background: #00ff00; color: #000; }
        
        /* Эффекты хаоса */
        .effect-shake { animation: shake 0.2s infinite; display: inline-block; }
        .effect-invert { filter: invert(1); background: #ff0000 !important; color: #000; }
        .effect-glitch { text-shadow: 2px 2px #ff00fa, -2px -2px #00f0ff; font-weight: bold; }
        
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-1px, -2px) rotate(-1deg); }
            40% { transform: translate(-3px, 0px) rotate(1deg); }
            60% { transform: translate(0px, 2px) rotate(0deg); }
            80% { transform: translate(2px, -1px) rotate(1deg); }
            100% { transform: translate(1px, 1px) rotate(0deg); }
        }
    </style>
</head>
<body>

    <h1>MayheMessenger 🌀</h1>
    <div id="chat"></div>

    <input type="text" id="username" placeholder="Ваше имя" value="Аноним" style="width: 150px;">
    <input type="text" id="messageInput" placeholder="Введите сообщение..." style="width: 40%;">
    
    <select id="effectSelect">
        <option value="none">Без эффекта</option>
        <option value="shake">Тряска</option>
        <option value="invert">Инверсия боли</option>
        <option value="glitch">Глитч</option>
    </select>

    <button onclick="sendMessage()">Отправить хаос</button>

    <script>
        // Базовая конфигурация
        const SERVER_HOST = 'https://jrbxaskvqmnrwwdrsmoc.supabase.co';
        // ВНИМАТЕЛЬНО проверьте, чтобы этот ключ совпадал с вашим Publishable key до последнего символа!
        const SUPABASE_KEY = 'sb_publishable_oikYCFCq3-sSgirNwU8a1Q_sEtMK0vV';

        // Формируем URL, принудительно вшивая ключ в параметры строки (Query Params)
        const TARGET_URL = `${SERVER_HOST}/rest/v1/messages?apikey=${SUPABASE_KEY}`;

        // 1. Функция загрузки сообщений с сервера
        async function loadMessages() {
            try {
                // Добавляем параметры фильтрации через знак &
                const response = await fetch(`${TARGET_URL}&select=*&order=created_at.asc&limit=50`, {
                    headers: { 
                        'apikey': SUPABASE_KEY, 
                        'Authorization': `Bearer ${SUPABASE_KEY}` 
                    }
                });
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('chat').innerHTML = ''; // Очищаем чат перед рендером
                    if (data) data.forEach(appendMessage);
                } else {
                    console.error("Ошибка истории. Статус сервера:", response.status);
                }
            } catch (e) { 
                console.error("Ошибка при получении истории:", e); 
            }
        }

        // 2. Функция отправки нового сообщения
        async function sendMessage() {
            const sender = document.getElementById('username').value;
            const text = document.getElementById('messageInput').value;
            const effect_type = document.getElementById('effectSelect').value;
            if (!text.trim()) return;

            try {
                const response = await fetch(TARGET_URL, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify([{ sender, text, effect_type }])
                });

                if (response.ok) {
                    document.getElementById('messageInput').value = '';
                    loadMessages(); // Сразу обновляем чат у себя
                } else {
                    console.error("Сервер вернул ошибку при отправке. Статус:", response.status);
                }
            } catch (e) { 
                console.error("Сетевая ошибка отправки:", e); 
            }
        }

        // 3. Вывод сообщений на экран
        function appendMessage(msg) {
            const chatDiv = document.getElementById('chat');
            const msgEl = document.createElement('div');
            msgEl.classList.add('msg');
            
            if (msg.effect_type && msg.effect_type !== 'none') {
                msgEl.classList.add(`effect-${msg.effect_type}`);
            }

            msgEl.innerHTML = `<strong>[${msg.sender}]:</strong> ${msg.text}`;
            chatDiv.appendChild(msgEl);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        // Автоматическое обновление чата каждые 3 секунды
        setInterval(loadMessages, 3000);

        // Первый запуск при открытии
        loadMessages();
    </script>
</body>
</html>
